name: Release

# Publishes on a version tag, which `npm run release` creates and pushes.
# npm auth is OIDC (trusted publishing) rather than a token: the job proves its
# identity to npm with the `id-token` permission below, so no NPM_TOKEN is
# stored anywhere and a leaked secret can't publish this package.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for trusted publishing. Without it npm falls back to looking
      # for a token and the publish fails as unauthenticated.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1+, and the npm bundled with Node
      # ships older than that — without this the publish step looks for a token
      # that doesn't exist.
      #
      # Pinned to the 11 major rather than @latest: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `@latest` breaks this job every time
      # npm ships a major that outruns the Node line above. Raise both together.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # `npm ci` so the published artifact is built against the versions the
      # lockfile pins, not whatever satisfies the ranges on the day of the
      # release. Requires a lockfile written by npm 11+ — see the npm/cli#4828
      # note in ci.yml.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: OIDC supplies the credential, and provenance is
      # attached automatically.
      - name: Publish to npm
        run: npm publish --access public

      # The npm tarball, not a git archive: it contains the built dist/, which
      # is what the Homebrew formula installs.
      - name: Pack tarball for the release
        id: pack
        run: |
          NPM_TARBALL="$(npm pack)"
          RELEASE_TARBALL="paragraph-cli-${GITHUB_REF_NAME}.tgz"
          mv "$NPM_TARBALL" "$RELEASE_TARBALL"
          echo "tarball=$RELEASE_TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(openssl dgst -sha256 "$RELEASE_TARBALL" | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.pack.outputs.tarball }}
          body: |
            ## Install

            ```bash
            npm install -g @paragraph-com/cli@${{ github.ref_name }}
            ```

            ```bash
            brew tap paragraph-xyz/tap
            brew install paragraph
            ```

            **sha256:** `${{ steps.pack.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Homebrew tap, in its own reusable workflow so a failed tap update can
  # be retried by dispatching it — re-running this one would hit a republish
  # that npm always refuses.
  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
