name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm install` WITHOUT deleting the lockfile first. Deleting it (the
      # previous behavior) re-resolved every range on each run, so a
      # semver-compatible SDK release could change what CI tested with nothing
      # recording it — that is how the updatePublicationBody field removal
      # reached a release unnoticed (PAR-10415). Keeping the lockfile pins the
      # versions.
      #
      # Not `npm ci`: this lockfile is generated on macOS and npm omits the
      # other platforms' optional binaries from it (npm/cli#4828), so a strict
      # install on Linux dies at `Cannot find module
      # @rollup/rollup-linux-x64-gnu`. `npm install` honors the locked versions
      # and still resolves the host's binaries.
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node dist/index.js --version
      - run: npm test
