name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` rather than deleting the lockfile and reinstalling. Deleting it
      # (the previous behavior) re-resolved every range on each run, so a
      # semver-compatible SDK release could change what CI tested with nothing
      # recording it — that is how the updatePublicationBody field removal
      # reached a release unnoticed (PAR-10415).
      #
      # Deleting it was a workaround for npm/cli#4828: a lockfile written by
      # npm 10 records only the host platform's optional binaries, so `npm ci`
      # on Linux died at `Cannot find module @rollup/rollup-linux-x64-gnu`. The
      # lockfile has been regenerated with npm 11, which records every
      # platform, so the strict install now works and the workaround is gone.
      # Regenerate with npm 11+ or that failure comes back.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # The compatibility check that matters on old Node: package.json promises
      # engines >=18, and this proves the built CLI actually starts there.
      - run: node dist/index.js --version
      # Vitest needs `styleText` from node:util, which landed in Node 20, so the
      # suite cannot run on 18 — a dev-tooling limit, not a runtime one. Skipped
      # rather than dropping 18 from the matrix, so the smoke check above keeps
      # the engines >=18 claim honest. Remove the condition if engines is ever
      # raised to >=20.
      - run: npm test
        if: matrix.node-version != 18
