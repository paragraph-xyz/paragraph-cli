name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` rather than deleting the lockfile and reinstalling: resolving
      # fresh on every run meant a semver-compatible SDK release could change
      # what CI tested without anything recording it, which is how the
      # updatePublicationBody field removal reached a release unnoticed
      # (PAR-10415). CI now tests the versions the lockfile pins.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node dist/index.js --version
      - run: npm test
